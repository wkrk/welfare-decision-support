[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "welfare-analysis"
version = "1.0.0"
description = "Ansan welfare accessibility decision-support analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "geopandas>=0.14,<2", "folium>=0.15,<1", "branca>=0.7,<1", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
